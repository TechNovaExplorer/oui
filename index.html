<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>L'Éveil</title>
    <style>
        body {
            margin: 0; padding: 0; overflow: hidden;
            background: linear-gradient(to bottom, #1a2a6c, #b21f1f, #fdbb2d);
            height: 100vh; font-family: 'Segoe UI', sans-serif; user-select: none;
            color: white;
        }
        .ground { position: absolute; bottom: 0; left: 0; width: 100%; height: 40px; background: #111; z-index: 10; border-top: 2px solid #333; pointer-events: none; }
        #game-area { position: absolute; width: 100%; height: 100%; z-index: 1; }

        .seed { position: absolute; transform: translateX(-50%); z-index: 5; pointer-events: none; border-radius: 50%; border: 1px solid rgba(255,255,255,0.3); }
        .plant-wrapper { position: absolute; bottom: 40px; z-index: 4; transform: translateX(-50%); pointer-events: none; }

        .stem { width: 4px; background: #228b22; height: 0; border-radius: 2px; transform-origin: bottom center; }
        .flower { position: absolute; top: 0; left: 50%; transform: translate(-50%, -50%) scale(0); border-radius: 50%; transition: transform 0.5s; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        .flower::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); border-radius: 50%; background: rgba(0,0,0,0.5); width: 30%; height: 30%; }

        .plant-wrapper.bloomed .flower { transform: translate(-50%, -50%) scale(1); }
        .plant-wrapper.wilted .stem { background: #5c4033 !important; }
        .plant-wrapper.wilted .flower { filter: grayscale(100%) brightness(0.5); transform: translate(-50%, -50%) scale(0.7); }
        .plant-wrapper.hide { transform: translateX(-50%) translateY(100%); transition: transform 0.2s; }
        .plant-wrapper.giant .stem { width: 10px; }
        .plant-wrapper.giant .flower { width: 80px !important; height: 80px !important; }

        .dropped-seed {
            position: absolute; z-index: 100; pointer-events: auto; cursor: pointer;
            border-radius: 50%; border: 1px solid #fff; box-shadow: 0 0 8px rgba(255,255,255,0.8);
            animation: pulse 1s infinite alternate;
        }
        @keyframes pulse { 0% { transform: translateX(-50%) scale(1); } 100% { transform: translateX(-50%) scale(1.2); } }

        /* UI Styles */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; }
        .hud { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8); padding: 10px 20px; border-radius: 10px; pointer-events: auto; display: flex; gap: 15px; border: 1px solid #444; }
        .money { font-size: 1.5rem; font-weight: bold; color: #ffd700; }
        button { background: #333; color: white; border: 1px solid #555; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover:not(:disabled) { background: #555; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .inventory-bar { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); padding: 10px; border-radius: 10px; border: 1px solid #444; pointer-events: auto; display: flex; gap: 10px; max-width: 90vw; overflow-x: auto; }
        .inventory-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; padding: 5px 10px; border-radius: 5px; border: 2px solid transparent; min-width: 50px; background: #222; }
        .inventory-item:hover { background: #333; }
        .inventory-item.selected { border-color: #ffd700; background: #444; }
        .inv-seed-icon { width: 15px; height: 15px; border-radius: 50%; margin-bottom: 5px; border: 1px solid rgba(255,255,255,0.5); }
        .inv-count { font-weight: bold; font-size: 0.9rem; }

        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1a1a1a; padding: 20px; border-radius: 10px; border: 2px solid #555; pointer-events: auto; z-index: 1000; width: 80%; max-width: 800px; max-height: 80vh; overflow-y: auto; color: white; }
        .modal.active { display: block; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; padding-bottom: 10px; margin-bottom: 20px; }

        .shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .shop-item { border: 1px solid #444; border-radius: 5px; padding: 15px; background: #222; text-align: center; }
        .shop-actions { display: flex; gap: 5px; margin-top: 10px; }
        .shop-actions button { flex: 1; padding: 5px; font-size: 0.8rem; }

        .contracts-list, .lab-area { display: flex; flex-direction: column; gap: 10px; }
        .contract, .lab-slot { background: #222; border: 1px solid #444; padding: 15px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; }

        .lab-select { display: flex; gap: 10px; align-items: center; justify-content: center; margin-bottom: 20px; }
        .lab-select select { background: #333; color: white; border: 1px solid #555; padding: 10px; border-radius: 5px; }

        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 999; pointer-events: auto; }
        .overlay.active { display: block; }

        .cursor-mode { position: fixed; top: 50px; left: 50%; transform: translateX(-50%); background: #8b008b; color: white; padding: 5px 15px; border-radius: 20px; font-weight: bold; pointer-events: none; display: none; z-index: 200; border: 2px solid #ff00ff; box-shadow: 0 0 10px #ff00ff; }
        body.potion-cursor { cursor: crosshair; }

        .blackhole-fx { position: absolute; border-radius: 50%; background: radial-gradient(circle, #000 30%, #4b0082 80%, transparent); opacity: 0.5; pointer-events: none; z-index: 2; transform: translate(-50%, -50%); }
    </style>
</head>
<body>
    <div class="ground"></div>
    <div id="game-area"></div>

    <div id="potion-indicator" class="cursor-mode">Potion Active (Cliquez sur une plante)</div>

    <div id="ui-layer">
        <div class="hud">
            <div class="money">💰 <span id="money-display">50</span></div>
            <button onclick="toggleModal('shop-modal')">🏪 Boutique</button>
            <button onclick="toggleModal('lab-modal')">⚗️ Laboratoire</button>
            <button onclick="toggleModal('contracts-modal')">📜 Contrats</button>
        </div>
        <div class="inventory-bar" id="inventory-bar"></div>
    </div>

    <div class="overlay" id="overlay" onclick="closeModals()"></div>

    <!-- Shop Modal -->
    <div class="modal" id="shop-modal">
        <div class="modal-header"><h2>Boutique de l'Éveil</h2><button onclick="closeModals()">X</button></div>
        <div class="shop-grid" id="shop-grid"></div>
    </div>

    <!-- Lab Modal -->
    <div class="modal" id="lab-modal">
        <div class="modal-header"><h2>Laboratoire d'Alchimie</h2><button onclick="closeModals()">X</button></div>
        <div class="lab-area">
            <p>Mélangez deux graines pour créer une potion. Attention aux compatibilités !</p>
            <div class="lab-select">
                <select id="lab-seed-1"><option value="">Sélectionner Graine 1</option></select>
                <span>+</span>
                <select id="lab-seed-2"><option value="">Sélectionner Graine 2</option></select>
                <button onclick="mixPotion()" style="background: #8b008b;">Mélanger</button>
            </div>
            <div id="lab-result" style="text-align: center; font-weight: bold; color: #ff00ff; min-height: 20px;"></div>
        </div>
    </div>

    <!-- Contracts Modal -->
    <div class="modal" id="contracts-modal">
        <div class="modal-header"><h2>Contrats de l'Éveil</h2><button onclick="closeModals()">X</button></div>
        <div class="contracts-list" id="contracts-list"></div>
    </div>

    <script>
        // 1. Définition des Graines (Les 10 premières de la liste de 50)
        const SEED_DEFS = [
            { id: 't0', name: 'Pousse Simple', color: '#8fbc8f', behavior: 'none', lifespan: 15000, drops: [1, 15] },
            { id: 't1', name: 'Herbe Dansante', color: '#32cd32', behavior: 'dance', lifespan: 18000, drops: [1, 14] },
            { id: 't2', name: 'Pousse Couarde', color: '#ffffe0', behavior: 'hide', lifespan: 20000, drops: [1, 12] },
            { id: 't3', name: 'Liane Voyageuse', color: '#228b22', behavior: 'move', lifespan: 25000, drops: [1, 10] },
            { id: 't4', name: 'Ronce Parasite', color: '#8b0000', behavior: 'parasite', lifespan: 30000, drops: [1, 8] },
            { id: 't5', name: 'Bourgeon Attractif', color: '#ff69b4', behavior: 'magnet', lifespan: 35000, drops: [1, 6] },
            { id: 't6', name: 'Fleur Ombre', color: '#4b0082', behavior: 'shadow', lifespan: 40000, drops: [1, 5] },
            { id: 't7', name: 'Cristalline', color: '#00ffff', behavior: 'explode', lifespan: 45000, drops: [1, 4] },
            { id: 't8', name: 'Orgeuil Doré', color: '#ffd700', behavior: 'giant_low_drop', lifespan: 50000, drops: [1, 2] },
            { id: 't9', name: 'Singularité', color: '#000000', behavior: 'blackhole', lifespan: 60000, drops: [1, 1] }
        ];

        // Économie Loi Exponentielle
        let baseCost = 10;
        let baseSellMult = 0.5;
        SEED_DEFS.forEach((def, i) => {
            def.cost = Math.floor(baseCost * Math.pow(2.5, i));
            def.sell = Math.floor(def.cost * baseSellMult * Math.pow(0.95, i));
            if(def.sell < 1) def.sell = 1;
        });

        // 2. État du Jeu
        let money = 50;
        let inventory = { 't0': 5 };
        let selectedSeedId = 't0';
        let activePotion = null; // Type de potion active

        let plants = [];
        let droppedSeeds = [];

        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;

        let contracts = [
            { id: 1, text: "Livrer 5 Pousses Couardes", req: 't2', reqAmt: 5, reward: 1000, done: false },
            { id: 2, text: "Livrer 2 Lignes Voyageuses", req: 't3', reqAmt: 2, reward: 2500, done: false },
            { id: 3, text: "La Quête de la Singularité", req: 't9', reqAmt: 1, reward: 200000, done: false }
        ];

        const gameArea = document.getElementById('game-area');

        // Initialisation UI
        updateUI();

        // Écouteurs globaux
        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        gameArea.addEventListener('click', (e) => {
            if(e.target.closest('.dropped-seed') || e.target.closest('.plant-wrapper')) return;

            // Si on a une potion, on annule en cliquant dans le vide
            if(activePotion) {
                activePotion = null;
                document.body.classList.remove('potion-cursor');
                document.getElementById('potion-indicator').style.display = 'none';
                return;
            }

            if(selectedSeedId && inventory[selectedSeedId] > 0) {
                inventory[selectedSeedId]--;
                plantSeed(e.clientX, selectedSeedId);
                updateUI();
            }
        });

        // 3. Moteur de Jeu (Game Loop)
        let lastTime = performance.now();
        function gameLoop(time) {
            let dt = time - lastTime;
            lastTime = time;

            plants.forEach((p, index) => {
                if(p.state === 'dead') return;

                p.age += dt;

                // Croissance
                if(p.state === 'growing') {
                    let progress = Math.min(1, p.age / (p.def.lifespan * 0.3)); // Prend 30% du temps pour pousser
                    p.elements.stem.style.height = (progress * p.maxHeight) + 'px';
                    if(progress >= 1) {
                        p.state = 'blooming';
                        p.elements.wrapper.classList.add('bloomed');
                    }
                }
                else if(p.state === 'blooming') {
                    if(p.age >= p.def.lifespan * 0.8) {
                        p.state = 'wilting';
                        p.elements.wrapper.classList.remove('bloomed');
                        p.elements.wrapper.classList.add('wilted');
                    }
                }
                else if(p.state === 'wilting') {
                    if(p.age >= p.def.lifespan) {
                        diePlant(p);
                    }
                }

                // --- Comportements Autonomes Radicaux ---
                if(p.state !== 'seed' && p.state !== 'dead') {
                    switch(p.def.behavior) {
                        case 'dance':
                            p.elements.stem.style.transform = `rotate(${Math.sin(time/200) * 20}deg)`;
                            break;

                        case 'hide':
                            let dist = Math.abs(mouseX - p.x);
                            if(dist < 100 && mouseY > window.innerHeight - 200) {
                                p.elements.wrapper.classList.add('hide');
                            } else {
                                p.elements.wrapper.classList.remove('hide');
                            }
                            break;

                        case 'move':
                            p.x += Math.sin(time/1000) * 0.5; // Oscille de gauche à droite
                            p.elements.wrapper.style.left = p.x + 'px';
                            break;

                        case 'parasite':
                            // Aspire la vie des autres plantes proches (+age aux autres, -age à soi)
                            plants.forEach(other => {
                                if(other !== p && Math.abs(other.x - p.x) < 50 && other.state !== 'dead') {
                                    other.age += dt * 0.5; // L'autre vieillit plus vite
                                    p.age -= dt * 0.1; // Le parasite rajeunit
                                }
                            });
                            break;

                        case 'magnet':
                            // Attire les graines droppées
                            droppedSeeds.forEach(ds => {
                                let dsDist = p.x - ds.x;
                                if(Math.abs(dsDist) < 150) {
                                    ds.x += Math.sign(dsDist) * 0.5;
                                    ds.element.style.left = ds.x + 'px';
                                }
                            });
                            break;

                        case 'shadow':
                            // Ne pousse que si proche d'une autre plante plus grande
                            let shaded = plants.some(other => other !== p && Math.abs(other.x - p.x) < 30 && other.maxHeight > p.maxHeight);
                            if(!shaded && p.state === 'growing') {
                                p.age -= dt; // Stoppe la croissance
                                p.elements.stem.style.opacity = '0.5';
                            } else {
                                p.elements.stem.style.opacity = '1';
                            }
                            break;

                        case 'blackhole':
                            // Gère le trou noir (détruit voisins)
                            if(!p.bhFx) {
                                p.bhFx = document.createElement('div');
                                p.bhFx.className = 'blackhole-fx';
                                p.bhFx.style.width = '200px'; p.bhFx.style.height = '200px';
                                p.bhFx.style.left = p.x + 'px'; p.bhFx.style.top = (window.innerHeight - 80) + 'px';
                                gameArea.appendChild(p.bhFx);
                            }
                            p.bhFx.style.transform = `translate(-50%, -50%) rotate(${time/10}deg)`;

                            plants.forEach(other => {
                                if(other !== p && Math.abs(other.x - p.x) < 100 && other.state !== 'dead') {
                                    other.age = other.def.lifespan; // Tue instantanément
                                    p.age -= 5000; // Boost massif
                                }
                            });
                            break;
                    }
                }
            });

            requestAnimationFrame(gameLoop);
        }
        requestAnimationFrame(gameLoop);

        // 4. Logique de Plantation et Cycle
        function plantSeed(x, seedId) {
            const def = SEED_DEFS.find(s => s.id === seedId);

            const wrapper = document.createElement('div');
            wrapper.className = 'plant-wrapper';
            wrapper.style.left = x + 'px';

            if(def.behavior === 'giant_low_drop') wrapper.classList.add('giant');

            const stem = document.createElement('div');
            stem.className = 'stem';
            stem.style.background = def.color;

            const flower = document.createElement('div');
            flower.className = 'flower';
            flower.style.width = '30px'; flower.style.height = '30px';
            flower.style.background = def.color;

            wrapper.appendChild(stem);
            wrapper.appendChild(flower);
            gameArea.appendChild(wrapper);

            const p = {
                x: x, def: def, age: 0, state: 'growing',
                maxHeight: 100 + Math.random() * 100,
                elements: { wrapper, stem, flower }
            };

            // Interaction Potion
            wrapper.addEventListener('click', (e) => {
                if(activePotion) {
                    e.stopPropagation();
                    applyPotion(p);
                }
            });

            plants.push(p);
        }

        function diePlant(p) {
            p.state = 'dead';
            p.elements.wrapper.style.opacity = '0';
            if(p.bhFx) p.bhFx.remove();

            setTimeout(() => {
                p.elements.wrapper.remove();
                const currentIndex = plants.indexOf(p);
                if (currentIndex > -1) {
                    plants.splice(currentIndex, 1);
                }
            }, 1000);

            // Rendement (Drop Rate avec probabilités pondérées)
            let maxDrops = p.def.drops[1];
            let minDrops = p.def.drops[0];

            // Calcul exponentiel inversé pour les drops (difficile d'avoir max)
            let r = Math.random();
            let dropCount = minDrops;
            // Fonction de répartition : r^2 favorise les petits nombres
            dropCount = Math.floor(minDrops + Math.pow(r, 2) * (maxDrops - minDrops + 1));

            // Orgueil Doré spécificité
            if(p.def.behavior === 'giant_low_drop') dropCount = Math.min(2, dropCount);

            for(let i=0; i<dropCount; i++) {
                spawnDrop(p.x, p.def);
            }
        }

        function spawnDrop(x, def) {
            const groundY = window.innerHeight - 40;
            const drop = document.createElement('div');
            drop.className = 'dropped-seed';
            drop.style.width = '12px'; drop.style.height = '12px';
            drop.style.background = def.color;

            // Dispersion
            let startX = x + (Math.random() - 0.5) * 20;
            let endX = x + (Math.random() - 0.5) * 100;

            // Si c'est Cristalline Piquante, explosion
            if(def.behavior === 'explode') endX = x + (Math.random() - 0.5) * 400;

            drop.style.left = startX + 'px';
            drop.style.top = (groundY - 50) + 'px';
            gameArea.appendChild(drop);

            let ds = { element: drop, x: endX };
            droppedSeeds.push(ds);

            setTimeout(() => {
                drop.style.transition = 'all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
                drop.style.left = endX + 'px';
                drop.style.top = groundY + 'px';
            }, 50);

            drop.addEventListener('click', (e) => {
                e.stopPropagation();
                collectDrop(ds, def.id);
            });

            setTimeout(() => {
                if(drop.parentNode) collectDrop(ds, null); // Despawn without collection
            }, 15000);
        }

        function collectDrop(ds, id) {
            if(ds.element.parentNode) ds.element.remove();
            droppedSeeds = droppedSeeds.filter(d => d !== ds);
            if(id) {
                inventory[id] = (inventory[id] || 0) + 1;
                updateUI();
            }
        }

        // 5. Laboratoire d'Alchimie
        function mixPotion() {
            let s1 = document.getElementById('lab-seed-1').value;
            let s2 = document.getElementById('lab-seed-2').value;
            let res = document.getElementById('lab-result');

            if(!s1 || !s2) { res.innerText = "Sélectionnez 2 graines."; return; }
            if(inventory[s1] < 1 || inventory[s2] < 1) { res.innerText = "Graines insuffisantes."; return; }
            if(s1 === s2 && inventory[s1] < 2) { res.innerText = "Graines insuffisantes."; return; }

            inventory[s1]--; inventory[s2]--;

            // Recettes
            let pType = 'random';
            if(s1 === 't0' && s2 === 't0') pType = 'growth';
            else if(s1 === 't2' && s2 === 't2') pType = 'poison';
            else if((s1 === 't8' && s2 === 't9') || (s1 === 't9' && s2 === 't8')) pType = 'mutation';

            activePotion = pType;
            res.innerText = `Potion ${pType.toUpperCase()} créée ! Cliquez sur une plante.`;
            document.body.classList.add('potion-cursor');
            document.getElementById('potion-indicator').style.display = 'block';

            updateUI();
            setTimeout(closeModals, 1000);
        }

        function applyPotion(p) {
            if(activePotion === 'growth') p.age += 10000;
            if(activePotion === 'poison') p.age = p.def.lifespan; // Kills it
            if(activePotion === 'mutation') p.elements.flower.style.background = '#fff'; // Visual debug

            activePotion = null;
            document.body.classList.remove('potion-cursor');
            document.getElementById('potion-indicator').style.display = 'none';
        }

        // 6. Contrats
        function deliverContract(id) {
            let c = contracts.find(x => x.id === id);
            if(c && !c.done && inventory[c.req] >= c.reqAmt) {
                inventory[c.req] -= c.reqAmt;
                money += c.reward;
                c.done = true;
                updateUI();
            }
        }

        // 7. UI Management
        function updateUI() {
            document.getElementById('money-display').innerText = money;

            // Inventory
            const bar = document.getElementById('inventory-bar');
            bar.innerHTML = '';
            let hasSelection = false;

            Object.keys(inventory).forEach(id => {
                if(inventory[id] > 0) {
                    let def = SEED_DEFS.find(s => s.id === id);
                    if(id === selectedSeedId) hasSelection = true;

                    bar.innerHTML += `
                        <div class="inventory-item ${id === selectedSeedId ? 'selected' : ''}" onclick="selectSeed('${id}', event)">
                            <div class="inv-seed-icon" style="background:${def.color};"></div>
                            <div class="inv-count">${inventory[id]}</div>
                        </div>
                    `;
                }
            });
            if(!hasSelection) selectedSeedId = null;

            // Shop
            const grid = document.getElementById('shop-grid');
            grid.innerHTML = '';
            SEED_DEFS.forEach(def => {
                let owned = inventory[def.id] || 0;
                grid.innerHTML += `
                    <div class="shop-item">
                        <div style="width:30px; height:30px; background:${def.color}; border-radius:50%; margin:0 auto 10px;"></div>
                        <h4>${def.name}</h4>
                        <p style="font-size:0.8em; color:#aaa;">${getBehaviorText(def.behavior)}</p>
                        <p style="font-size:0.9em; margin:5px 0;">Possédé: ${owned}</p>
                        <div class="shop-actions">
                            <button onclick="buy('${def.id}')" ${money < def.cost ? 'disabled' : ''}>Acheter (${def.cost}💰)</button>
                            <button onclick="sell('${def.id}')" ${owned === 0 ? 'disabled' : ''}>Vendre (${def.sell}💰)</button>
                        </div>
                    </div>
                `;
            });

            // Lab selects
            let labOptions = '<option value="">Sélectionner</option>';
            Object.keys(inventory).forEach(id => {
                if(inventory[id] > 0) {
                    let def = SEED_DEFS.find(s => s.id === id);
                    labOptions += `<option value="${id}">${def.name} (${inventory[id]})</option>`;
                }
            });
            document.getElementById('lab-seed-1').innerHTML = labOptions;
            document.getElementById('lab-seed-2').innerHTML = labOptions;

            // Contracts
            const cList = document.getElementById('contracts-list');
            cList.innerHTML = '';
            contracts.forEach(c => {
                let def = SEED_DEFS.find(s => s.id === c.req);
                let owned = inventory[c.req] || 0;
                let canDeliver = owned >= c.reqAmt && !c.done;

                cList.innerHTML += `
                    <div class="contract" style="opacity: ${c.done ? '0.5' : '1'}">
                        <div>
                            <h4>${c.text}</h4>
                            <p style="margin:5px 0; font-size:0.9em;">Récompense: ${c.reward} 💰 | Progression: ${owned}/${c.reqAmt} ${def.name}</p>
                        </div>
                        <button onclick="deliverContract(${c.id})" ${!canDeliver ? 'disabled' : ''} style="background: ${c.done ? '#4CAF50' : '#2196F3'}">
                            ${c.done ? 'Complété' : 'Livrer'}
                        </button>
                    </div>
                `;
            });
        }

        function getBehaviorText(b) {
            const txts = {
                'none': 'Plante classique.',
                'dance': 'Danse au vent.',
                'hide': 'Se cache de la souris.',
                'move': 'Se déplace lentement.',
                'parasite': 'Aspire la vie des voisins.',
                'magnet': 'Attire les graines tombées.',
                'shadow': 'Ne pousse qu\'à l\'ombre.',
                'explode': 'Graines explosives.',
                'giant_low_drop': 'Géante mais max 2 graines.',
                'blackhole': 'Détruit voisins pour croître.'
            };
            return txts[b] || '';
        }

        function selectSeed(id, e) {
            e.stopPropagation();
            selectedSeedId = id;
            updateUI();
        }

        window.buy = function(id) {
            let def = SEED_DEFS.find(s => s.id === id);
            if(money >= def.cost) {
                money -= def.cost;
                inventory[id] = (inventory[id] || 0) + 1;
                updateUI();
            }
        };

        window.sell = function(id) {
            if(inventory[id] > 0) {
                let def = SEED_DEFS.find(s => s.id === id);
                money += def.sell;
                inventory[id]--;
                updateUI();
            }
        };

        window.toggleModal = function(id) {
            updateUI();
            document.getElementById(id).classList.add('active');
            document.getElementById('overlay').classList.add('active');
        };

        window.closeModals = function() {
            document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
            document.getElementById('overlay').classList.remove('active');
            document.getElementById('lab-result').innerText = '';
        };

    </script>
</body>
</html>
