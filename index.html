<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARC to ONMX Converter</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        arc: {
                            0: '#000000', // black
                            1: '#0074D9', // blue
                            2: '#FF4136', // red
                            3: '#2ECC40', // green
                            4: '#FFDC00', // yellow
                            5: '#AAAAAA', // grey
                            6: '#F012BE', // fuchsia
                            7: '#FF851B', // orange
                            8: '#7FDBFF', // teal
                            9: '#870C25'  // brown
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Grid = ({ grid }) => {
            if (!grid || grid.length === 0) return null;
            return (
                <div
                    className="inline-grid gap-px bg-gray-600 border-2 border-gray-600"
                    style={{
                        gridTemplateColumns: `repeat(${grid[0].length}, minmax(0, 1fr))`
                    }}
                >
                    {grid.map((row, rowIndex) =>
                        row.map((cell, colIndex) => {
                            const colorClass = `bg-arc-${cell}`;
                            return (
                                <div
                                    key={`${rowIndex}-${colIndex}`}
                                    className={`w-6 h-6 sm:w-8 sm:h-8 ${colorClass}`}
                                    title={`Value: ${cell}`}
                                />
                            );
                        })
                    )}
                </div>
            );
        };

        const TaskVisualizer = ({ task }) => {
            if (!task) return null;
            return (
                <div className="space-y-8">
                    <div>
                        <h3 className="text-xl font-bold mb-4 text-green-400">Paires d'entraînement</h3>
                        <div className="flex flex-col space-y-6">
                            {task.train.map((pair, index) => (
                                <div key={index} className="flex flex-col md:flex-row gap-4 items-center bg-gray-700 p-4 rounded-lg">
                                    <div className="flex flex-col items-center">
                                        <span className="mb-2 text-sm text-gray-300">Entrée {index + 1}</span>
                                        <Grid grid={pair.input} />
                                    </div>
                                    <div className="hidden md:block text-2xl text-gray-400">→</div>
                                    <div className="flex flex-col items-center">
                                        <span className="mb-2 text-sm text-gray-300">Sortie {index + 1}</span>
                                        <Grid grid={pair.output} />
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div>
                        <h3 className="text-xl font-bold mb-4 text-yellow-400">Paires de test</h3>
                        <div className="flex flex-col space-y-6">
                            {task.test.map((pair, index) => (
                                <div key={index} className="flex flex-col md:flex-row gap-4 items-center bg-gray-700 p-4 rounded-lg">
                                    <div className="flex flex-col items-center">
                                        <span className="mb-2 text-sm text-gray-300">Entrée Test {index + 1}</span>
                                        <Grid grid={pair.input} />
                                    </div>
                                    <div className="hidden md:block text-2xl text-gray-400">→</div>
                                    <div className="flex flex-col items-center">
                                        <span className="mb-2 text-sm text-gray-300">Sortie Test {index + 1}</span>
                                        {pair.output ? <Grid grid={pair.output} /> : <div className="w-full h-full min-w-[3rem] min-h-[3rem] border-2 border-dashed border-gray-500 flex items-center justify-center text-gray-500">?</div>}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        function App() {
            const [tasks, setTasks] = useState({});
            const [selectedTaskId, setSelectedTaskId] = useState(null);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);

            const handleFolderSelect = async (event) => {
                const files = event.target.files;
                if (!files || files.length === 0) return;

                setLoading(true);
                setError(null);
                const loadedTasks = {};

                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    if (file.name.endsWith('.json')) {
                        try {
                            const text = await file.text();
                            const data = JSON.parse(text);
                            // Only add files that look like ARC tasks (have train and test arrays)
                            if (data.train && data.test) {
                                const taskId = file.name.replace('.json', '');
                                loadedTasks[taskId] = data;
                            }
                        } catch (err) {
                            console.error(`Erreur de lecture du fichier ${file.name}:`, err);
                        }
                    }
                }

                setTasks(loadedTasks);
                const taskIds = Object.keys(loadedTasks);
                if (taskIds.length > 0) {
                    setSelectedTaskId(taskIds[0]);
                } else {
                    setError("Aucun fichier de tâche ARC valide trouvé dans le dossier.");
                }
                setLoading(false);
            };

            return (
                <div className="container mx-auto p-4">
                    <h1 className="text-3xl font-bold mb-6 text-blue-400">Convertisseur ARC vers ONMX</h1>
                    <div className="bg-gray-800 p-6 rounded-lg shadow-lg mb-6">
                        <div className="mb-4">
                            <label className="block text-sm font-medium mb-2 text-gray-300">
                                Sélectionner un dossier contenant des problèmes ARC (.json)
                            </label>
                            <input
                                type="file"
                                webkitdirectory="true"
                                directory="true"
                                multiple
                                onChange={handleFolderSelect}
                                className="block w-full text-sm text-gray-400
                                  file:mr-4 file:py-2 file:px-4
                                  file:rounded file:border-0
                                  file:text-sm file:font-semibold
                                  file:bg-blue-600 file:text-white
                                  hover:file:bg-blue-700
                                  cursor-pointer"
                            />
                        </div>

                        {loading && <p className="text-blue-400">Chargement des fichiers...</p>}
                        {error && <p className="text-red-400">{error}</p>}

                        {Object.keys(tasks).length > 0 && (
                            <div className="mt-4">
                                <label className="block text-sm font-medium mb-2 text-gray-300">
                                    Tâche sélectionnée ({Object.keys(tasks).length} trouvées)
                                </label>
                                <select
                                    value={selectedTaskId || ''}
                                    onChange={(e) => setSelectedTaskId(e.target.value)}
                                    className="bg-gray-700 border border-gray-600 text-white text-sm rounded focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
                                >
                                    {Object.keys(tasks).map(id => (
                                        <option key={id} value={id}>{id}</option>
                                    ))}
                                </select>
                            </div>
                        )}
                    </div>

                    {selectedTaskId && tasks[selectedTaskId] && (
                        <div className="bg-gray-800 p-6 rounded-lg shadow-lg">
                            <div className="flex justify-between items-center mb-6 border-b border-gray-700 pb-4">
                                <h2 className="text-2xl font-bold text-white">
                                    Tâche: {selectedTaskId}
                                </h2>
                                <button
                                    onClick={() => {
                                        const mockONMXCode = `// Code ONMX généré automatiquement pour la tâche ${selectedTaskId}\n// Analyse heuristique : Règle logique estimée.\n\nconst solution = {\n  type: "Transformation",\n  heuristics: ["Mappage de couleur", "Détection de bordure"],\n  task_id: "${selectedTaskId}"\n};\n\nexport default solution;`;
                                        const blob = new Blob([mockONMXCode], { type: 'text/plain' });
                                        const url = URL.createObjectURL(blob);
                                        const a = document.createElement('a');
                                        a.href = url;
                                        a.download = `${selectedTaskId}_solution.onmx`;
                                        document.body.appendChild(a);
                                        a.click();
                                        document.body.removeChild(a);
                                        URL.revokeObjectURL(url);
                                    }}
                                    className="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition duration-150 ease-in-out"
                                >
                                    Générer & Télécharger Solution (.onmx)
                                </button>
                            </div>
                            <TaskVisualizer task={tasks[selectedTaskId]} />
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
